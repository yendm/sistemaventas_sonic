   SAL_CODIGOS, así cualquier equipo puede validar un código sin base de datos. OJO: es un filtro de uso, no seguridad real (ver README). */

const SAL_CODIGOS="sonic-chincha";   // CÁMBIALA antes de publicar (al cambiarla, los códigos anteriores dejan de valer y hay que generar otros)
const REVOCADOS=[];                  // códigos dados de baja, por ejemplo ["MAY-12345-ABC"]
const cdc=(t,n)=>{let h1=0xdeadbeef,h2=0x41c6ce57;const q=SAL_CODIGOS+"|"+t+"|"+n;
  for(let i=0;i<q.length;i++){const c=q.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return((h2>>>0)*4294967296+(h1>>>0)).toString(36).toUpperCase().slice(-3).padStart(3,"0")};

async function hsh(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sonic|"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "sonic|"+t)h=((h<<5)+h+c.charCodeAt(0))|0;return"f"+h}}

function prep(a){return a.map((p,i)=>{p=Object.assign({},p);p.id=p.id||i+1;p.sku=p.sku||"SK"+String(p.id).padStart(4,"0");
p.precioMayorista=p.precioMayorista||+(p.precio*0.9).toFixed(2);p.cantidadMayorista=p.cantidadMayorista||10;
p.precioCompra=+p.precioCompra||0;p.nombre=NOM[p.sku]||p.nombre;p.stock=ST[p.sku]??p.stock??20;p.alias=p.alias||[];p.imagen=p.imagen||CATS[p.categoria]||"📦";p.subcategoria=p.subcategoria||"Otros";
p._w=norm([p.nombre,p.marca,p.categoria,p.subcategoria,p.sku,p.presentacion,...p.alias].join(" ")).split(/[^a-z0-9]+/).filter(Boolean);return p})}

/* =====================================================
   5. BÚSQUEDA INTELIGENTE (sin tildes, tolera errores, palabras en cualquier orden)
   ===================================================== */
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function buscar(q){
  const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return[];
  return PROD.map(p=>{let s=0;
    for(const k of t){const w=p._w;
      if(w.includes(k))s+=3;
      else if(w.some(x=>x.includes(k)))s+=2;
      else if(k.length>=4&&w.some(x=>lev(k,x.slice(0,k.length+1))<=(k.length>=7?2:1)))s+=1;
      else return null}            // todas las palabras deben coincidir
    return{p,s}}).filter(Boolean).sort((a,b)=>b.s-a.s).map(r=>r.p);
}

function resumen(f1,f2,top){
  const docs=HIST.filter(d=>{const f=ymd(d.fvta||d.fecha);return f>=f1&&f<=f2}),ok=docs.filter(d=>d.estado!=="convertida"&&!d.cot&&d.estado!=="anulada"),an=docs.filter(d=>d.estado==="anulada"),
    r={docs:ok.length,v:0,uds:0,vc:0,vs:0,cmv:0,dto:0,anu:an.length,anuT:an.reduce((s,d)=>s+d.total,0),pv:{},pr:{}};
  ok.forEach(d=>{r.v+=d.total;r.dto+=d.dto||0;const vn=d.vend||"—",pvr=r.pv[vn]||(r.pv[vn]={v:0,g:0});pvr.v+=d.total;
    (d.it||[]).forEach(x=>{const imp=x.pu*x.q,k=x.lib?x.n:(x.k||x.n);if(!x.lib)r.uds+=x.q;
      const t=top?(r.pr[k]||(r.pr[k]={n:x.n,q:0,g:0})):null;if(t)t.q+=x.q;
      if(x.co>0){const g=imp-x.co*x.q;r.vc+=imp;r.cmv+=x.co*x.q;pvr.g+=g;if(t)t.g+=g}else r.vs+=imp})});
  r.g=r.vc-r.cmv;r.mg=r.vc?r.g/r.vc*100:0;return r}
function serie(){const out=[],base=new Date(RS.f+"T12:00:00");
  if(RS.r==="12"){for(let i=11;i>=0;i--){const a=new Date(base.getFullYear(),base.getMonth()-i,1),b=new Date(a.getFullYear(),a.getMonth()+1,0),r=resumen(ymd(a),ymd(b));
    out.push({l:a.toLocaleDateString("es-PE",{month:"short"}),t:a.toLocaleDateString("es-PE",{month:"long",year:"numeric"}),v:r.v,g:r.g})}}
  else{const n=+RS.r;for(let i=n-1;i>=0;i--){const a=new Date(base);a.setDate(a.getDate()-i);const k=ymd(a),r=resumen(k,k);out.push({l:String(a.getDate()),t:a.toLocaleDateString("es-PE"),v:r.v,g:r.g})}}
  return out}
function chartSvg(sr){const W=600,H=190,pl=46,pt=10,n=sr.length,mx=Math.max(1,...sr.map(b=>b.v)),bw=(W-pl)/n;
  let g=`<svg viewBox="0 0 ${W} ${H+24}" style="width:100%;height:auto" role="img" aria-label="Gráfico de ventas y ganancia">`;
  [0,.5,1].forEach(t=>{const y=pt+(H-pt)*(1-t);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#dde"/><text x="${pl-4}" y="${y+4}" font-size="10" text-anchor="end" fill="#667">${Math.round(mx*t)}</text>`});

    if(pr==="1"){SES=u.id;try{sessionStorage.setItem("sonic_ses",SES)}catch(e){}S.modo="vendedor";ov("");render()}else vend()},
  neg(v){NG={id:v,v:""};drawNg()},
  ngk(v){v=D(v);if(v==="c")NG.v=NG.v.slice(0,-1);else if(v==="."){if(!NG.v.includes("."))NG.v=(NG.v||"0")+"."}else if(NG.v.length<8&&!/\.\d\d$/.test(NG.v))NG.v+=v;drawNg()},
  ngp(v){const x=items().find(i=>i.p.id==NG.id);NG.v=(Math.round(x.pl*(1-v/100)*100)/100).toFixed(2);drawNg()},

  ngok(){const x=items().find(i=>i.p.id==NG.id),val=parseFloat(NG.v);
    if(!(val>0))return drawNg("Escribe un precio");
    
    const min=minPrecio(x.pl);if(val<min)return drawNg("Mínimo permitido: "+money(min));
    if(val===x.pl)delete S.neg[NG.id];else S.neg[NG.id]=val;ov("");render()},

    {const m=parseFloat(g("c_mg"));N.margenMm=isNaN(m)?7:Math.min(15,Math.max(0,m))}N.wsAlmacen=tel(g("c_wal"));N.sucursal=g("c_suc")||N.sucursal;if(g("c_pv"))N.pv=g("c_pv").replace(/\D/g,"").padStart(3,"0").slice(-3);
    if(LOGOTMP!==undefined)N.logo=LOGOTMP||"";
    try{localStorage.setItem("sonic_cfg",JSON.stringify(N))}catch(e){alert("No se pudo guardar (almacenamiento lleno). Prueba con un logotipo más liviano.")}

/* =====================================================
   9. IMPORTAR CSV
   Columnas: nombre,categoria,subcategoria,marca,presentacion,precio,precioMayorista,
   cantidadMayorista,stock,imagen,alias (separados con |),masVendido (si/true/1),sku
   ===================================================== */
function csv(t){const l1=t.split(/\r?\n/)[0]||"",dl=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?";":",";   // Excel en español suele guardar con punto y coma
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch===dl){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x))rows.push(r);return rows}
// Nombres de columna aceptados (sin importar mayúsculas, tildes o guiones): precio_compra, costo, precio público, etc.
const HM={nombre:"nombre",producto:"nombre",categoria:"categoria",subcategoria:"subcategoria",marca:"marca",presentacion:"presentacion",precio:"precio",preciopublico:"precio",preciomayorista:"precioMayorista",cantidadmayorista:"cantidadMayorista",stock:"stock",imagen:"imagen",alias:"alias",masvendido:"masVendido",sku:"sku",preciocompra:"precioCompra",costo:"precioCompra"};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{const rows=csv(fr.result.replace(/^\uFEFF/,"")),h=rows.shift().map(x=>HM[norm(x).replace(/[^a-z]/g,"")]||x.trim());
    const num=["precio","precioMayorista","cantidadMayorista","stock","precioCompra"];let ign=0;
    const arr=rows.map(r=>{const o={};h.forEach((k,i)=>{let v=(r[i]||"").trim();if(v==="")return;
      if(num.includes(k)){v=parseFloat(v.replace(/[^\d.,-]/g,"").replace(",","."));if(isNaN(v))return}else if(k==="alias")v=v.split("|");else if(k==="masVendido")v=/^(si|sí|true|1)$/i.test(v);o[k]=v});return o}).filter(o=>{const ok=o.nombre&&o.precio>0;if(!ok)ign++;return ok});
    if(!arr.length){alert("No se encontraron productos. Revisa que la primera fila tenga los encabezados (nombre, categoria, precio…).");return}
    const w=[],sc=arr.filter(o=>!(o.precioCompra>0)).length,my=arr.filter(o=>o.precioMayorista>o.precio).map(o=>o.nombre),pe=arr.filter(o=>o.precioCompra>0&&o.precioCompra>(o.precioMayorista||o.precio*0.9)).map(o=>o.nombre),sk={},du=[];
    arr.forEach(o=>{if(o.sku){if(sk[o.sku])du.push(o.sku);sk[o.sku]=1}});
    if(ign)w.push(ign+" fila(s) ignoradas por no tener nombre o precio.");
    if(sc)w.push(sc+" producto(s) sin precio de compra: no entrarán en la ganancia.");
    if(my.length)w.push("Precio mayorista MAYOR al público en: "+my.slice(0,3).join(", ")+(my.length>3?"…":""));
    if(pe.length)w.push("Precio de compra mayor al de venta (pérdida) en: "+pe.slice(0,3).join(", ")+(pe.length>3?"…":""));
    if(du.length)w.push("SKU repetidos: "+du.slice(0,3).join(", "));
    if(!confirm("Se reemplazará el catálogo actual ("+PROD.length+" productos) por "+arr.length+" productos del archivo, con el stock que trae el archivo."+(w.length?"\n\nAvisos:\n• "+w.join("\n• "):"")+"\n\n¿Continuar?"))return;
    RAW=arr;for(const k in NOM)delete NOM[k];try{localStorage.removeItem("sonic_nom")}catch(e){}for(const k in ST)delete ST[k];try{localStorage.removeItem("sonic_stock")}catch(e){}PROD=prep(RAW);try{localStorage.setItem("catalogo",JSON.stringify(RAW))}catch(e){}
    alert(arr.length+" productos importados");A.home()};
  fr.readAsText(f,"UTF-8");e.target.value=""};

$("#flogo").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,320/im.width,160/im.height),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    LOGOTMP=c.toDataURL("image/jpeg",0.9);$("#lgp").innerHTML=`<img src="${LOGOTMP}" alt="" style="max-width:200px;max-height:80px">`;URL.revokeObjectURL(u)};
  im.src=u;e.target.value=""};
$("#file2").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const a=JSON.parse(fr.result);if(!Array.isArray(a))throw 0;const have=new Set(HIST.map(d=>d.nro));let n=0,ds=0,dup=0;
    a.forEach(d=>{if(!d||!d.nro)return;
      if(!have.has(d.nro)){HIST.push(d);n++;   // si la venta viene de OTRO equipo, descuenta su stock aquí
        if(d.pv&&d.pv!==NEGOCIO.pv&&!d.ref&&!d.cot)(d.it||[]).forEach(x=>{const p=PROD.find(q=>q.sku===x.k);if(p){p.stock=Math.max(0,p.stock-x.q);ST[p.sku]=p.stock;ds++}})}
      else{const o=HIST.find(x=>x.nro===d.nro);if(o&&(o.total!==d.total||o.fecha!==d.fecha))dup++}});HIST.sort((x,y)=>y.fecha.localeCompare(x.fecha));
    HIST.forEach(d=>{const t=d.tp||"PF",n=parseInt(String(d.nro).split("-").pop())||0;if(!String(d.nro).startsWith(ser(t)+"-"))return;S.cnt[t]=Math.max(S.cnt[t]||1,n+1)});savePF();save();try{localStorage.setItem("sonic_stock",JSON.stringify(ST))}catch(e){}
    alert(n+" documentos importados"+(ds?" · stock actualizado ("+ds+" líneas)":"")+(dup?"\n⚠ "+dup+" documentos NO se importaron porque su número ya existe con otros datos. Revisa que cada equipo tenga un código distinto (Personalizar recibo).":""));
    (VOLVER==="bal"?A.bal():A.hist())}
    catch(err){alert("El archivo no es un respaldo válido.")}};
  fr.readAsText(f);e.target.value=""};

render();
