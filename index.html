{nombre:"Tubo PVC agua 1/2\" C-10",categoria:"Gasfitería",subcategoria:"Tuberías",marca:"Pavco",presentacion:"Tubo 5 m",precio:12,alias:["tubería"]},

/* =====================================================
   3. UTILIDADES, ESTADO Y GUARDADO (localStorage)
   ===================================================== */
const $=s=>document.querySelector(s);
const E=encodeURIComponent, D=decodeURIComponent;
const money=n=>"S/ "+Number(n).toFixed(2);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
let S=Object.assign({modo:"cliente",cart:{},rec:[],tipo:"publico",cli:{nombre:"",tel:""},fmt:"80",nro:1,hist:[],neg:{}},LS("sonic",{}));
let HIST=LS("sonic_pf",null)||S.hist||[];   // todas las proformas guardadas
const savePF=()=>{try{localStorage.setItem("sonic_pf",JSON.stringify(HIST))}catch(e){alert("⚠ Almacenamiento lleno: exporta un respaldo de tus proformas.")}};
try{if(!localStorage.getItem("sonic_pf"))savePF()}catch(e){}
// ---- Vendedores registrados y sesión (la sesión se cierra al cerrar la pestaña o con "Cerrar sesión") ----
let VEND=LS("sonic_vend",[]);
const saveV=()=>{try{localStorage.setItem("sonic_vend",JSON.stringify(VEND))}catch(e){alert("No se pudo guardar el registro de vendedores.")}};
let REG=Object.assign({mayoristaPct:50,monto:500,extra:5},LS("sonic_reglas",{}));   // reglas de descuento (las edita el administrador)
let SES=null;try{SES=sessionStorage.getItem("sonic_ses")}catch(e){}
const USR=()=>VEND.find(v=>v.id===SES);
const esAdmin=()=>!!USR()&&USR().rol==="admin";
if(MODO_PUBLICO||(S.modo==="vendedor"&&!USR()))S.modo="cliente";   // para atender como vendedor hay que iniciar sesión
async function hsh(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sonic|"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "sonic|"+t)h=((h<<5)+h+c.charCodeAt(0))|0;return"f"+h}}
if(!S.cnt)S.cnt={NV:1,PF:S.nro||1,BV:1,FA:1};   // correlativos: Nota de venta, Proforma, Boleta, Factura
S.tmp={};S.nav={cat:null,sub:null,f:{},q:""};S.ent="retiro";S.dir="";
const save=()=>{try{localStorage.setItem("sonic",JSON.stringify({modo:S.modo,cart:S.cart,rec:S.rec,tipo:S.tipo,cli:S.cli,fmt:S.fmt,nro:S.nro,neg:S.neg,cnt:S.cnt}))}catch(e){}};

// Completa los campos que falten y prepara las palabras para buscar
function prep(a){return a.map((p,i)=>{p=Object.assign({},p);p.id=p.id||i+1;p.sku=p.sku||"SK"+String(p.id).padStart(4,"0");
p.precioMayorista=p.precioMayorista||+(p.precio*0.9).toFixed(2);p.cantidadMayorista=p.cantidadMayorista||10;
p.stock=ST[p.sku]??p.stock??20;p.alias=p.alias||[];p.imagen=p.imagen||CATS[p.categoria]||"📦";p.subcategoria=p.subcategoria||"Otros";
p._w=norm([p.nombre,p.marca,p.categoria,p.subcategoria,p.sku,p.presentacion,...p.alias].join(" ")).split(/[^a-z0-9]+/).filter(Boolean);return p})}
const ST=LS("sonic_stock",{});   // stock descontado por ventas (clave: sku)
let RAW=LS("catalogo",null)||BASE;
let PROD=prep(RAW);
const prod=id=>PROD.find(p=>p.id==id);

/* =====================================================
   4. PRECIOS
   Público: precio normal, y precio por volumen desde cantidadMayorista.
   Mayorista (solo modo vendedor): siempre precioMayorista.
   ===================================================== */
const tipo=()=>S.modo==="vendedor"?S.tipo:"publico";
const pu=(p,q)=>(tipo()==="mayorista"||q>=p.cantidadMayorista)?p.precioMayorista:p.precio;

/* =====================================================
   5. BÚSQUEDA INTELIGENTE (sin tildes, tolera errores, palabras en cualquier orden)
   ===================================================== */
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function buscar(q){
  const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return[];
  return PROD.map(p=>{let s=0;
    for(const k of t){const w=p._w;
      if(w.includes(k))s+=3;
      else if(w.some(x=>x.includes(k)))s+=2;
      else if(k.length>=4&&w.some(x=>lev(k,x.slice(0,k.length+1))<=(k.length>=7?2:1)))s+=1;
      else return null}            // todas las palabras deben coincidir
    return{p,s}}).filter(Boolean).sort((a,b)=>b.s-a.s).map(r=>r.p);
}
function sug(){

function balData(f){
  const me=USR(),todo=veTodo();
  const L=HIST.filter(d=>d.estado!=="convertida"&&ymd(d.fvta||d.fecha)===f&&(todo||d.vend===me.nombre));
  const P={},V={},Su={};let u=0,m=0;
  L.forEach(d=>{const v=d.vend||"—",s=d.suc||"Principal";V[v]=(V[v]||0)+d.total;Su[s]=(Su[s]||0)+d.total;m+=d.total;
    d.it.forEach(x=>{const k=x.k||x.n+"|"+x.pr,o=P[k]||(P[k]={n:x.n,pr:x.pr,k:x.k,q:0,t:0});o.q+=x.q;o.t+=x.q*x.pu;u+=x.q})});
  return{L,P:Object.values(P).sort((a,b)=>b.q-a.q),V,Su,u,m}}

/* =====================================================
   9. IMPORTAR CSV
   Columnas: nombre,categoria,subcategoria,marca,presentacion,precio,precioMayorista,
   cantidadMayorista,stock,imagen,alias (separados con |),masVendido (si/true/1),sku
   ===================================================== */
function csv(t){const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","||ch==";"){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x))rows.push(r);return rows}
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{const rows=csv(fr.result),h=rows.shift().map(x=>x.trim());
    const num=["precio","precioMayorista","cantidadMayorista","stock"];
    const arr=rows.map(r=>{const o={};h.forEach((k,i)=>{let v=(r[i]||"").trim();if(v==="")return;
      if(num.includes(k))v=parseFloat(v.replace(",","."));else if(k==="alias")v=v.split("|");else if(k==="masVendido")v=/^(si|sí|true|1)$/i.test(v);o[k]=v});return o}).filter(o=>o.nombre&&o.precio);
    if(!arr.length){alert("No se encontraron productos. Revisa los encabezados del CSV.");return}
    RAW=arr;for(const k in ST)delete ST[k];try{localStorage.removeItem("sonic_stock")}catch(e){}PROD=prep(RAW);try{localStorage.setItem("catalogo",JSON.stringify(RAW))}catch(e){}
    alert(arr.length+" productos importados");A.home()};
  fr.readAsText(f,"UTF-8")};

$("#flogo").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,320/im.width,160/im.height),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    LOGOTMP=c.toDataURL("image/jpeg",0.9);$("#lgp").innerHTML=`<img src="${LOGOTMP}" alt="" style="max-width:200px;max-height:80px">`;URL.revokeObjectURL(u)};
  im.src=u;e.target.value=""};
$("#file2").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const a=JSON.parse(fr.result);if(!Array.isArray(a))throw 0;const have=new Set(HIST.map(d=>d.nro));let n=0,ds=0,dup=0;
    a.forEach(d=>{if(!d||!d.nro)return;
      if(!have.has(d.nro)){HIST.push(d);n++;   // si la venta viene de OTRO equipo, descuenta su stock aquí
        if(d.pv&&d.pv!==NEGOCIO.pv&&!d.ref)(d.it||[]).forEach(x=>{const p=PROD.find(q=>q.sku===x.k);if(p){p.stock=Math.max(0,p.stock-x.q);ST[p.sku]=p.stock;ds++}})}
      else{const o=HIST.find(x=>x.nro===d.nro);if(o&&(o.total!==d.total||o.fecha!==d.fecha))dup++}});HIST.sort((x,y)=>y.fecha.localeCompare(x.fecha));
    HIST.forEach(d=>{const t=d.tp||"PF",n=parseInt(String(d.nro).split("-").pop())||0;if(!String(d.nro).startsWith(ser(t)+"-"))return;S.cnt[t]=Math.max(S.cnt[t]||1,n+1)});savePF();save();try{localStorage.setItem("sonic_stock",JSON.stringify(ST))}catch(e){}
    alert(n+" documentos importados"+(ds?" · stock actualizado ("+ds+" líneas)":"")+(dup?"\n⚠ "+dup+" documentos NO se importaron porque su número ya existe con otros datos. Revisa que cada equipo tenga un código distinto (Personalizar recibo).":""));
    (VOLVER==="bal"?A.bal():A.hist())}
    catch(err){alert("El archivo no es un respaldo válido.")}};
  fr.readAsText(f);e.target.value=""};

render();
